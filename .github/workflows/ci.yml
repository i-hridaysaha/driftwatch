name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: driftwatch
          POSTGRES_PASSWORD: driftwatch
          POSTGRES_DB: driftwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U driftwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://driftwatch:driftwatch@localhost:5432/driftwatch
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.29"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Test (pytest)
        run: uv run pytest

      - name: Demo scenarios: generate and verify
        # pytest's migrated_db fixture downgrades back to "base" once its
        # last module finishes, so the schema can't be assumed to still be
        # there -- re-run migrations explicitly rather than relying on
        # pytest's leftover state. Each scenario truncates every app table
        # on load (see driftwatch.demo.build.reset_database), so these must
        # run one at a time, generate-then-verify, never in parallel.
        run: |
          uv run alembic upgrade head
          for scenario in clean covariate_shift segment_isolated concept_drift; do
            echo "::group::$scenario"
            uv run python -m driftwatch.cli demo "$scenario"
            uv run python -m driftwatch.cli demo-verify "$scenario"
            echo "::endgroup::"
          done

  docker-compose-smoke-test:
    # Verifies the stated deliverable "docker compose up brings the whole
    # stack up" actually works, on a runner that has Docker (this project's
    # own dev environment does not). This only proves the images build and
    # the API process starts and responds -- /health is a pure liveness
    # check with no DB dependency (see driftwatch.api.routes.health), so it
    # does not exercise migrations or any DB-backed endpoint. That's a
    # known, deliberate scope limit of this smoke test, not an oversight.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for the API health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API is healthy"
              exit 0
            fi
            echo "waiting for API to become healthy... ($i/30)"
            sleep 2
          done
          echo "API did not become healthy within the timeout"
          docker compose ps
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
