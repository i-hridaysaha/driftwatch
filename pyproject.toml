[project]
name = "driftwatch"
version = "0.1.0"
description = "Model-agnostic ML monitoring and drift detection service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10",
    "streamlit>=1.39",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.9.0",
]

[project.scripts]
driftwatch = "driftwatch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "scipy-stubs>=1.17.1.5",
    "pandas-stubs>=3.0.3.260530",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftwatch"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]  # FastAPI's Depends()-as-default is the documented idiom

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
