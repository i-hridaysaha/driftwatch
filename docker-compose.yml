services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: driftwatch
      POSTGRES_PASSWORD: driftwatch
      POSTGRES_DB: driftwatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://driftwatch:driftwatch@postgres:5432/driftwatch
      # export API_KEY before `docker compose up` to require X-API-Key on
      # every write; left unset, the API is open and says so at startup
      API_KEY: ${API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # Same image as api -- identical dependencies, different entrypoint. Runs
    # as its own process/container rather than in-process with the API so
    # that scaling the API to multiple replicas never runs multiple
    # schedulers concurrently by accident.
    command: ["uv", "run", "python", "-m", "driftwatch.scheduler.run"]
    environment:
      DATABASE_URL: postgresql+psycopg://driftwatch:driftwatch@postgres:5432/driftwatch
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://driftwatch:driftwatch@postgres:5432/driftwatch
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
