services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: driftwatch
      POSTGRES_PASSWORD: driftwatch
      POSTGRES_DB: driftwatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://driftwatch:driftwatch@postgres:5432/driftwatch
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
